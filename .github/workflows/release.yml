name: Build and release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out GTA Map Hotkey
        uses: actions/checkout@v4

      - name: Check out Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: 0cfee7cb32f5a8608fc7ca181cdb39fd7e1d91e4
          path: plugin-sdk
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate Plugin SDK projects
        working-directory: plugin-sdk
        shell: pwsh
        run: >-
          .\tools\premake\premake5.exe
          vs2022
          --file=.\tools\premake\premake5.lua

      - name: Correct Plugin SDK VC offset assertion
        shell: pwsh
        run: |
          $path = '.\plugin-sdk\plugin_vc\game_vc\CRunningScript.h'
          $text = Get-Content $path -Raw
          $text = $text.Replace('m_bAwake, 0x7B', 'm_bSkipWakeTime, 0x7B')
          Set-Content $path $text

      - name: Build Plugin SDK libraries
        shell: pwsh
        run: |
          msbuild .\plugin-sdk\plugin_III\Plugin_III.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild .\plugin-sdk\plugin_vc\Plugin_VC.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild .\plugin-sdk\plugin_sa\Plugin_SA.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Generate GTA Map Hotkey project
        shell: pwsh
        run: >-
          .\plugin-sdk\tools\premake\premake5.exe
          vs2022
          --file=.\premake5.lua

      - name: Build all game variants
        shell: pwsh
        run: |
          msbuild .\project_files\map-hotkey.sln /m /t:Build /p:Configuration=ReleaseIII /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild .\project_files\map-hotkey.sln /m /t:Build /p:Configuration=ReleaseVC /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild .\project_files\map-hotkey.sln /m /t:Build /p:Configuration=ReleaseSA /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\release\III | Out-Null
          New-Item -ItemType Directory -Force .\release\VC | Out-Null
          New-Item -ItemType Directory -Force .\release\SA | Out-Null
          Copy-Item .\output\asi\MapHotkeyIII.asi .\release\III\
          Copy-Item .\resources\MapHotkeyIII.ini .\release\III\
          Copy-Item .\output\asi\MapHotkeyVC.asi .\release\VC\
          Copy-Item .\resources\MapHotkeyVC.ini .\release\VC\
          Copy-Item .\output\asi\MapHotkeySA.asi .\release\SA\
          Copy-Item .\resources\MapHotkeySA.ini .\release\SA\
          Compress-Archive -Path .\release\III\* -DestinationPath .\release\MapHotkeyIII.zip
          Compress-Archive -Path .\release\VC\* -DestinationPath .\release\MapHotkeyVC.zip
          Compress-Archive -Path .\release\SA\* -DestinationPath .\release\MapHotkeySA.zip

      - name: Upload GTA III artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapHotkeyIII
          path: release/MapHotkeyIII.zip
          if-no-files-found: error

      - name: Upload Vice City artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapHotkeyVC
          path: release/MapHotkeyVC.zip
          if-no-files-found: error

      - name: Upload San Andreas artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapHotkeySA
          path: release/MapHotkeySA.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MapHotkeyIII.zip
            release/MapHotkeyVC.zip
            release/MapHotkeySA.zip
          generate_release_notes: true
